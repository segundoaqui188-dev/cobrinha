name: Compilar APK Raylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite que você aperte o botão manualmente se quiser

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5  # Atualizado para v5 para corrigir o aviso
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android NDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias de Compilacao
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Baixar e Compilar Raylib para Android
        run: |
          git clone --depth 1 https://github.com
          cd raylib/src
          # Compila a biblioteca Raylib usando o NDK do Android
          make PLATFORM=PLATFORM_ANDROID ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          # Instala os arquivos compilados no sistema da máquina virtual
          sudo make install PLATFORM=PLATFORM_ANDROID ANDROID_NDK=$ANDROID_NDK_LATEST_HOME

      - name: Compilar o Jogo e Gerar APK
        run: |
          mkdir build && cd build
          # Comando robusto de compilação cruzada usando o CMake oficial do NDK
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-29 \
                -DCMAKE_BUILD_TYPE=Release ..
          make
          
      - name: Upload do APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Jogo-Cobrinha-Android
          path: |
            **/*.apk
            build/*.apk
