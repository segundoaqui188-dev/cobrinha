name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android-build:
    name: Build Snake Android APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      ANDROID_API: "29"
      ANDROID_NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.31.6"
      RAYLIB_VERSION: "6.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses <<< "y" || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Download Raylib source
        run: |
          curl -L \
            "https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz" \
            -o raylib.tar.gz

          tar -xzf raylib.tar.gz

          mv "raylib-${RAYLIB_VERSION}" raylib

          test -f raylib/CMakeLists.txt

      - name: Configure Raylib for Android
        run: |
          cmake \
            -S raylib \
            -B raylib/build-android \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="${ANDROID_NDK_HOME}" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"

      - name: Build Raylib
        run: |
          cmake \
            --build raylib/build-android \
            --config Release \
            --parallel 2

      - name: Prepare Android project
        run: |
          rm -rf android-build

          mkdir -p android-build/app/src/main/cpp
          mkdir -p android-build/app/src/main

          cp main.c android-build/app/src/main/cpp/main.c
          cp CMakeLists.txt android-build/app/src/main/cpp/CMakeLists.txt
          cp AndroidManifest.xml android-build/app/src/main/AndroidManifest.xml

          cp -R raylib android-build/app/src/main/cpp/raylib

      - name: Show project files
        run: |
          echo "===== PROJECT ====="
          find android-build -maxdepth 5 -type f | sort
          echo "==================="

      - name: Configure game
        working-directory: android-build
        run: |
          cmake \
            -S app/src/main/cpp \
            -B build \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="${ANDROID_NDK_HOME}" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_MAKE_PROGRAM="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/ninja"

      - name: Build native game
        working-directory: android-build
        run: |
          cmake --build build --config Release --parallel 2

      - name: Build APK
        working-directory: android-build
        run: |
          mkdir -p apk

          if [ -f "build/Snake-Raylib-Android.apk" ]; then
            cp "build/Snake-Raylib-Android.apk" "apk/Snake-Raylib-Android.apk"
          else
            echo "APK não encontrado pelo CMake."
            find build -type f | sort
            exit 1
          fi

      - name: Verify APK
        working-directory: android-build
        run: |
          test -f apk/Snake-Raylib-Android.apk

          echo "APK encontrado:"
          ls -lh apk/Snake-Raylib-Android.apk

          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify \
            apk/Snake-Raylib-Android.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Raylib-Android-arm64-v8a
          path: android-build/apk/Snake-Raylib-Android.apk
          if-no-files-found: error
          retention-days: 30
