name: Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Snake Android APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "29"
      ANDROID_NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "CMAKE_BIN=${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "SDK: ${ANDROID_SDK_ROOT}"
          echo "NDK: ${ANDROID_NDK_HOME}"
          echo "CMake: ${CMAKE_BIN}"

          test -f "${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"
          test -x "${CMAKE_BIN}/cmake"
          test -x "${CMAKE_BIN}/ninja"

          "${CMAKE_BIN}/cmake" --version
          "${CMAKE_BIN}/ninja" --version

      - name: Configure project
        shell: bash
        run: |
          rm -rf build

          "${CMAKE_BIN}/cmake" \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_static \
            -DPLATFORM=Android \
            -DOPENGL_VERSION="ES 2.0" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_MAKE_PROGRAM="${CMAKE_BIN}/ninja"

      - name: Build game
        shell: bash
        run: |
          "${CMAKE_BIN}/cmake" \
            --build build \
            --config Release \
            --parallel 2

          echo "===== Build outputs ====="
          find build -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

          test -f build/apk-lib/arm64-v8a/libmain.so

      - name: Prepare APK
        shell: bash
        run: |
          rm -rf apk-stage base-extract

          mkdir -p apk-stage/lib/arm64-v8a

          cp AndroidManifest.xml \
            apk-stage/AndroidManifest.xml

          cp build/apk-lib/arm64-v8a/libmain.so \
            apk-stage/lib/arm64-v8a/libmain.so

      - name: Package unsigned APK
        shell: bash
        run: |
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}/android.jar"

          "$BUILD_TOOLS/aapt2" link \
            --proto-format \
            -o base-res.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml

          mkdir -p base-extract

          unzip -q base-res.apk -d base-extract

          cp -R apk-stage/lib base-extract/

          (
            cd base-extract
            zip -qr ../unsigned.apk .
          )

          test -f unsigned.apk

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Align and sign APK
        shell: bash
        run: |
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out Snake-Raylib-Android.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Snake-Raylib-Android.apk

          ls -lh Snake-Raylib-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Raylib-Android-arm64-v8a
          path: Snake-Raylib-Android.apk
          if-no-files-found: error
          retention-days: 30
